<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDAYIC Solutions - Under Construction</title>
  
  <!-- Cloudflare Turnstile API -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Top-Right Logo */
    .top-right-logo {
      position: absolute;
      top: 20px;
      right: 25px;
      width: 110px;
      height: auto;
      z-index: 10;
    }

    /* Main Container Card */
    .card {
      background-color: #1c2541;
      border-radius: 16px;
      padding: 24px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* Construction Image Overlay Wrapper */
    .image-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .main-banner {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Overlay "Name_1.PNG" onto the right side of the wooden wall */
    .wall-sign {
      position: absolute;
      bottom: 28%;
      right: 8%;
      width: 22%;
      max-width: 150px;
      filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.7));
      pointer-events: none;
    }

    .description {
      color: #95a5a6;
      font-size: 1.05rem;
      margin: 24px 0 20px 0;
      line-height: 1.5;
    }

    /* Action / Turnstile Section */
    .contact-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-height: 80px;
    }

    .btn-contact {
      background-color: #0088cc;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-contact:hover {
      background-color: #0077b5;
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 1. Top Right Logo (Logo_1.PNG) -->
  <img src="Logo_1.PNG" alt="UDAYIC Logo" class="top-right-logo">

  <div class="card">
    
    <!-- Construction Visual with Boundary Wall Sign overlay -->
    <div class="image-container">
      <img src="https://cdni.iconscout.com/illustration/premium/thumb/website-under-construction-illustration-download-in-svg-png-gif-file-formats--building-development-maintenance-pack-design-illustrations-8378036.png" alt="Under Construction" class="main-banner">
      <!-- 2. Overlay Name_1.PNG on the boundary wall -->
      <img src="Name_1.PNG" alt="UDAYIC Solutions" class="wall-sign">
    </div>

    <!-- Description Text (UDAYIC header removed) -->
    <p class="description">
      Our website is currently under progress. We are working hard to bring you something amazing!
    </p>

    <!-- Secure Contact Area -->
    <div class="contact-wrapper">
      
      <!-- Renamed "Contact us" Button -->
      <button id="contactBtn" class="btn-contact" onclick="initiateVerification()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Contact us
      </button>

      <!-- Cloudflare Turnstile Container (Hidden until user clicks button) -->
      <div id="turnstileBox" class="hidden">
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAFaOzFr3sNQ9_usH" 
             data-callback="onTurnstileSuccess"
             data-execution="render">
        </div>
      </div>

    </div>

  </div>

  <script>
    // Explicit user click trigger - prevents auto-launching email on page load
    function initiateVerification() {
      document.getElementById('contactBtn').classList.add('hidden');
      document.getElementById('turnstileBox').classList.remove('hidden');
    }

    // Secure callback once Turnstile challenge completes successfully
    function onTurnstileSuccess(token) {
      if (!token) return;

      // Obfuscated email reconstruction to safeguard against automated email scrapers
      const u = "contact";
      const d = "udayic.com";
      const targetMail = u + "@" + d;

      // Clean trigger of client mail composer upon verification
      window.location.href = "mailto:" + targetMail;
    }
  </script>

</body>
</html>
