<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDAYIC Solutions - Under Construction</title>
  
  <!-- Cloudflare Turnstile API -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f8f9fa;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Top-Right Logo (Name_1.PNG) */
    .top-right-logo {
      position: absolute;
      top: 25px;
      right: 30px;
      max-width: 180px;
      height: auto;
      z-index: 10;
    }

    /* Main Container Card */
    .card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 24px;
      max-width: 780px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
      text-align: center;
      margin-top: 60px;
    }

    /* Construction Image/SVG Container */
    .image-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #f1f3f5;
    }

    .main-banner {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Contact / Turnstile Section */
    .contact-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 28px;
      min-height: 70px;
    }

    .btn-contact {
      background-color: #0088cc;
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.25);
    }

    .btn-contact:hover {
      background-color: #0077b5;
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .top-right-logo {
        position: static;
        margin-bottom: 20px;
      }
      .card {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Top Right Logo Image (Name_1.PNG) -->
  <img src="Name_1.PNG" alt="UDAYIC Solutions" class="top-right-logo">

  <div class="card">
    
    <!-- Busy Construction Site Scene SVG -->
    <div class="image-container">
      <svg class="main-banner" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
        <rect width="800" height="450" fill="#e0f2fe"/>
        <path d="M0 320 Q200 310 400 320 T800 315 L800 450 L0 450 Z" fill="#94a3b8"/>
        <rect x="0" y="380" width="800" height="70" fill="#d1d5db"/>
        
        <!-- Scaffolding Building Structure -->
        <g stroke="#475569" stroke-width="2">
          <line x1="120" y1="120" x2="120" y2="380"/>
          <line x1="220" y1="120" x2="220" y2="380"/>
          <line x1="320" y1="120" x2="320" y2="380"/>
          <line x1="120" y1="180" x2="320" y2="180"/>
          <line x1="120" y1="240" x2="320" y2="240"/>
          <line x1="120" y1="300" x2="320" y2="300"/>
          <line x1="120" y1="120" x2="220" y2="180"/>
          <line x1="220" y1="120" x2="320" y2="180"/>
          <line x1="120" y1="180" x2="220" y2="240"/>
          <line x1="220" y1="180" x2="320" y2="240"/>
        </g>
        <rect x="130" y="140" width="180" height="240" fill="#cbd5e1" opacity="0.6"/>

        <!-- Heavy Tower Crane -->
        <rect x="370" y="50" width="12" height="330" fill="#f59e0b"/>
        <line x1="260" y1="70" x2="520" y2="70" stroke="#f59e0b" stroke-width="8"/>
        <line x1="376" y1="50" x2="520" y2="70" stroke="#d97706" stroke-width="3"/>
        <line x1="376" y1="50" x2="260" y2="70" stroke="#d97706" stroke-width="3"/>
        <line x1="480" y1="70" x2="480" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
        <rect x="460" y="190" width="40" height="30" fill="#64748b"/>

        <!-- Excavator Digger -->
        <rect x="540" y="320" width="90" height="45" rx="8" fill="#f59e0b"/>
        <rect x="550" y="300" width="45" height="30" rx="4" fill="#38bdf8"/>
        <circle cx="560" cy="370" r="16" fill="#1e293b"/>
        <circle cx="610" cy="370" r="16" fill="#1e293b"/>
        <path d="M620 330 L670 280 L710 320 L730 310" stroke="#d97706" stroke-width="10" stroke-linecap="round" fill="none"/>

        <!-- Busy Workers (Stickmen) -->
        <!-- Worker 1 on Scaffolding -->
        <circle cx="170" cy="165" r="5" fill="#1e293b"/>
        <line x1="170" y1="170" x2="170" y2="180" stroke="#1e293b" stroke-width="3"/>
        <path d="M165 162 A 6 6 0 0 1 175 162 Z" fill="#eab308"/>

        <!-- Worker 2 Ground Drilling -->
        <circle cx="450" cy="345" r="5" fill="#1e293b"/>
        <line x1="450" y1="350" x2="450" y2="365" stroke="#1e293b" stroke-width="3"/>
        <line x1="450" y1="365" x2="450" y2="380" stroke="#475569" stroke-width="4"/>
        <path d="M445 342 A 6 6 0 0 1 455 342 Z" fill="#eab308"/>

        <!-- Worker 3 Concrete Mixer Operator -->
        <circle cx="60" cy="345" r="5" fill="#1e293b"/>
        <line x1="60" y1="350" x2="60" y2="365" stroke="#1e293b" stroke-width="3"/>
        <path d="M55 342 A 6 6 0 0 1 65 342 Z" fill="#eab308"/>

        <!-- Concrete Mixer Machine -->
        <ellipse cx="95" cy="355" rx="25" ry="18" fill="#f59e0b" transform="rotate(-20 95 355)"/>
        <rect x="85" y="365" width="20" height="15" fill="#475569"/>

        <!-- Boundary Wooden Fence -->
        <g fill="#b45309" stroke="#78350f" stroke-width="1">
          <rect x="0" y="375" width="18" height="55" rx="2"/>
          <rect x="20" y="375" width="18" height="55" rx="2"/>
          <rect x="40" y="375" width="18" height="55" rx="2"/>
          <rect x="60" y="375" width="18" height="55" rx="2"/>
          <rect x="80" y="375" width="18" height="55" rx="2"/>
          <rect x="100" y="375" width="18" height="55" rx="2"/>
          <rect x="120" y="375" width="18" height="55" rx="2"/>
          <rect x="140" y="375" width="18" height="55" rx="2"/>
          <rect x="160" y="375" width="18" height="55" rx="2"/>
          <rect x="180" y="375" width="18" height="55" rx="2"/>
          <rect x="200" y="375" width="18" height="55" rx="2"/>
          <rect x="220" y="375" width="18" height="55" rx="2"/>
          <rect x="240" y="375" width="18" height="55" rx="2"/>
          <rect x="260" y="375" width="18" height="55" rx="2"/>
          <rect x="280" y="375" width="18" height="55" rx="2"/>
          <rect x="300" y="375" width="18" height="55" rx="2"/>
          <rect x="320" y="375" width="18" height="55" rx="2"/>
          <rect x="340" y="375" width="18" height="55" rx="2"/>
          <rect x="360" y="375" width="18" height="55" rx="2"/>
          <rect x="380" y="375" width="18" height="55" rx="2"/>
          <rect x="400" y="375" width="18" height="55" rx="2"/>
          <rect x="420" y="375" width="18" height="55" rx="2"/>
          <rect x="440" y="375" width="18" height="55" rx="2"/>
          <rect x="460" y="375" width="18" height="55" rx="2"/>
          <rect x="480" y="375" width="18" height="55" rx="2"/>
          <rect x="500" y="375" width="18" height="55" rx="2"/>
          <rect x="520" y="375" width="18" height="55" rx="2"/>
          <rect x="540" y="375" width="18" height="55" rx="2"/>
          <rect x="560" y="375" width="18" height="55" rx="2"/>
          <rect x="580" y="375" width="18" height="55" rx="2"/>
          <rect x="600" y="375" width="18" height="55" rx="2"/>
          <rect x="620" y="375" width="18" height="55" rx="2"/>
          <rect x="640" y="375" width="18" height="55" rx="2"/>
          <rect x="660" y="375" width="18" height="55" rx="2"/>
          <rect x="680" y="375" width="18" height="55" rx="2"/>
          <rect x="700" y="375" width="18" height="55" rx="2"/>
          <rect x="720" y="375" width="18" height="55" rx="2"/>
          <rect x="740" y="375" width="18" height="55" rx="2"/>
          <rect x="760" y="375" width="18" height="55" rx="2"/>
          <rect x="780" y="375" width="18" height="55" rx="2"/>
        </g>

        <!-- Construction Sign Board hanging on Fence -->
        <g transform="translate(210, 385)">
          <rect x="0" y="0" width="160" height="35" rx="4" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
          <text x="80" y="22" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">UNDER CONSTRUCTION</text>
        </g>
      </svg>
    </div>

    <!-- Secure Contact Area -->
    <div class="contact-wrapper">
      
      <!-- User Initiated "Contact us" Button -->
      <button id="contactBtn" class="btn-contact" onclick="initiateVerification()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Contact us
      </button>

      <!-- Cloudflare Turnstile Container -->
      <div id="turnstileBox" class="hidden">
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAFaOzFr3sNQ9_usH" 
             data-callback="onTurnstileSuccess"
             data-execution="render">
        </div>
      </div>

    </div>

  </div>

  <script>
    function initiateVerification() {
      document.getElementById('contactBtn').classList.add('hidden');
      document.getElementById('turnstileBox').classList.remove('hidden');
    }

    function onTurnstileSuccess(token) {
      if (!token) return;

      const u = "contact";
      const d = "udayic.com";
      const targetMail = u + "@" + d;

      window.location.href = "mailto:" + targetMail;
    }
  </script>

</body>
</html>
